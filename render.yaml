# Render Blueprint: "New +" -> "Blueprint" -> point at this repo. Fill DATABASE_URL (Neon) and LLM_API_KEY (Gemini) in the dashboard.
services:
  - type: web
    name: ledgerllm
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    # Deploy a commit on main only after its GitHub checks pass (lint, tests on SQLite and Postgres, both
    # eval gates) — what the README promises. `commit` would deploy on push, before CI has an answer.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: prod
      - key: LLM_PROVIDER
        value: gemini
      - key: GUARDRAILS_MODE           # new guardrail layers ship as shadow first, then enforce
        value: enforce
      - key: SUMMARIZE_PROMPT_VERSION  # prompt rollout and rollback: point at a prompts/*.yaml version
        value: summarize_v1
      - key: RESPONSE_CACHE_ENABLED    # false switches the response cache off without a deploy
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
