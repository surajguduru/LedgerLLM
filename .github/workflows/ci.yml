name: ci

# PRs are tested on GitHub's merge of the branch into main, so re-running the same suite when that PR merges
# adds nothing: push runs skip "Merge pull request" commits and still test direct pushes to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  test-postgres:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ledger, POSTGRES_PASSWORD: ledger, POSTGRES_DB: ledger }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Eval gate 1: red-team set vs the input guardrail. Free (no LLM calls in heuristic mode). Fails the PR on regression.
  eval-redteam:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: python -m evals.redteam.run --gate

  # Eval gate 2: summarization golden set. Programmatic checks always run (mock provider, free).
  # The LLM-judge run uses real models on Groq's free tier and needs LLM_API_KEY (a Groq key) as a repo
  # secret; it only runs on PRs that touch prompts/, the feature code or the eval, and only on the 8-case
  # CI subset (~4 min under Groq's 8,000 tokens/min). The full 30 cases are run locally and committed.
  eval-summarization:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }  # full history so the change detection below has a merge base
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: python -m evals.summarization.run --provider mock --gate
      - name: detect prompt/feature changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -Eq '^(prompts/|app/feature/|evals/summarization/)'; then
            echo "run_llm=true" >> "$GITHUB_OUTPUT"; else echo "run_llm=false" >> "$GITHUB_OUTPUT"; fi
      - name: LLM-judge eval (real model, CI subset)
        if: steps.changes.outputs.run_llm == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m evals.summarization.run --provider groq --subset ci --gate
