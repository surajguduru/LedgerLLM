services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-me}
      GUARDRAILS_MODE: ${GUARDRAILS_MODE:-enforce}
      SUMMARIZE_PROMPT_VERSION: ${SUMMARIZE_PROMPT_VERSION:-summarize_v1}
      RESPONSE_CACHE_ENABLED: ${RESPONSE_CACHE_ENABLED:-true}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Admin dashboard datasource (ops/grafana/provisioning/datasources/neon.yml). Point these at
      # the Neon READ REPLICA endpoint, never the read-write one. Unset: the Prometheus dashboard
      # still works and the admin one shows a datasource error.
      GRAFANA_DB_HOST: ${GRAFANA_DB_HOST:-}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-}
      GRAFANA_DB_NAME: ${GRAFANA_DB_NAME:-neondb}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
